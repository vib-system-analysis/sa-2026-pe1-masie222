services:
  app:
    image: python:3.12-alpine
    working_dir: /app
    command: python -m http.server 8080 --directory public
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./public:/app/public:ro
    environment:
      APP_HOST: ${APP_HOST:-127.0.0.1}
      APP_PORT: ${APP_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mock-model:
    image: python:3.12-alpine
    working_dir: /app
    command: python -m http.server 8081 --directory public/mock
    ports:
      - "8081:8081"
    volumes:
      - ./public/mock:/app/public/mock:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/status.json', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 10
    restart: unless-stopped
