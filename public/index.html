<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI-ассистент HR</title>
  <style>
    :root { font-family: Georgia, serif; color: #17202a; background: #f5f2eb; }
    body { margin: 0; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
    section { width: min(48rem, 100%); border-top: 5px solid #21618c; }
    h1 { max-width: 14ch; margin: 1.5rem 0 1rem; font-size: clamp(2.5rem, 8vw, 5.5rem); line-height: .9; letter-spacing: 0; }
    p { max-width: 38rem; font-size: 1.15rem; line-height: 1.55; }
    .status { display: inline-block; margin-top: 1.5rem; padding: .5rem .75rem; border: 1px solid #17202a; font-family: monospace; }
  </style>
</head>
<body>
  <main>
    <section>
      <p>Лабораторная 1 · MVP-заглушка</p>
      <h1>AI-ассистент HR</h1>
      <p>Рабочая точка интеграции для первичного отбора резюме: загрузка, оценка совместимости и объяснение останутся под контролем рекрутера.</p>
      <span class="status">SERVICE / HELLO WORLD / OK</span>
    </section>
  </main>
</body>
</html>
